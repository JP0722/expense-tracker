# Local development only. These credentials must not be reused on a public server.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: penny
      MYSQL_USER: penny
      MYSQL_PASSWORD: penny_local_only
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - penny_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: development
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: penny
      DB_USER: penny
      DB_PASSWORD: penny_local_only
      DB_TLS: "false"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  penny_mysql:
